[project]
name = "aax"
version = "0.1.0"
description = "Assistant Axis replikasyonu (arXiv:2601.10387)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = [
    "torch>=2.6",
    "transformers>=4.51",
    "accelerate>=1.0",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "matplotlib>=3.8",
]
gen = ["vllm>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: GPU veya ağır ML bağımlılığı gerektirir, varsayılan koşuda atlanır"]
addopts = "-m 'not gpu'"
