[project]
name = "aax"
version = "0.1.0"
description = "Assistant Axis replikasyonu (arXiv:2601.10387)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
